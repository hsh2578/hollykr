name: HollyKR Quarterly 5-Year Backtest

# 분기 1회 (1월/4월/7월/10월 1일 새벽 KST 02:00 = UTC 17:00 전날)
# 5년 데이터로 walk-forward + 그리드 서치 + hold-out 검증
# 결과: alpha_pool.json 자동 commit (영구 ALPHA 풀 갱신)

on:
  schedule:
    - cron: '0 17 30 3,6,9,12 *'  # 분기 마지막 달 30일 UTC 17:00 = 다음달 1일 KST 02:00
  workflow_dispatch:

jobs:
  quarterly-5y-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 720  # 12시간 (5년 12 윈도우 + 그리드 서치)
    env:
      TZ: Asia/Seoul

    steps:
      - name: Set timezone to KST
        run: |
          sudo timedatectl set-timezone Asia/Seoul || true
          date

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore HollyKR caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: holly-cache-${{ github.run_number }}
          restore-keys: |
            holly-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5-year comprehensive backtest
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: https://openapivts.koreainvestment.com:29443
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 -m scripts.screeners.holly_kr.backtest_5y --sample 200

      - name: Commit alpha_pool.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f data/holly_kr/alpha_pool.json ]; then
            git add data/holly_kr/alpha_pool.json
            if git diff --staged --quiet; then
              echo "No changes to ALPHA pool"
            else
              git commit -m "분기 5년 백테스트: ALPHA 풀 갱신"
              git push
            fi
          fi

      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5y-backtest-${{ github.run_number }}
          path: |
            data/holly_kr/alpha_pool.json
            data/holly_kr/backtest_summary_*.csv
            data/holly_kr/backtest_trades_*.csv
          retention-days: 90
          if-no-files-found: warn
