name: HollyKR Daily Scan

on:
  schedule:
    # 평일 14:40 KST = 05:40 UTC
    - cron: '40 5 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore HollyKR caches (OHLCV, KIS tokens, sectors, investor)
        uses: actions/cache@v4
        with:
          path: .cache
          key: holly-cache-${{ github.run_number }}
          restore-keys: |
            holly-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scanner (proven strategies, close-entry, telegram)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: https://openapivts.koreainvestment.com:29443
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python -m scripts.screeners.holly_kr.run --proven --entry close --telegram

      - name: Upload cache as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holly-cache-snapshot
          path: .cache/
          retention-days: 3
          if-no-files-found: ignore
