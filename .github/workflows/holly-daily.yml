name: HollyKR Daily Scan

on:
  schedule:
    # GitHub Actions cron은 피크타임에 1-2시간 지연됨.
    # 14:20 KST 실제 실행을 목표로 2시간 당긴 스케줄 (UTC 03:20 = KST 12:20).
    # 지연 2시간 적용 시 14:20 KST 근처 실행 예상.
    - cron: '20 3 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul

    steps:
      - name: Set timezone to KST
        run: |
          sudo timedatectl set-timezone Asia/Seoul || true
          date

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore HollyKR caches (OHLCV, KIS tokens, sectors, investor)
        uses: actions/cache@v4
        with:
          path: .cache
          key: holly-cache-${{ github.run_number }}
          restore-keys: |
            holly-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scanner (proven strategies, close-entry, telegram)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: https://openapivts.koreainvestment.com:29443
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python -m scripts.screeners.holly_kr.run --proven --entry close --telegram

      - name: Upload cache as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holly-cache-snapshot
          path: .cache/
          retention-days: 3
          if-no-files-found: ignore
