name: HollyKR Daily Scan

on:
  schedule:
    # GitHub Actions cron은 피크타임에 1-3시간 지연됨.
    # 15:00~15:30 KST 도착 목표 (동시호가 시간 직전).
    # UTC 03:30 = KST 12:30 스케줄. 평균 2-3시간 지연 → 14:30~16:00 실행 → 도착 15:00~16:00.
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul

    steps:
      - name: Set timezone to KST
        run: |
          sudo timedatectl set-timezone Asia/Seoul || true
          date

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore HollyKR caches (OHLCV, KIS tokens, sectors, investor)
        uses: actions/cache@v4
        with:
          path: .cache
          key: holly-cache-${{ github.run_number }}
          restore-keys: |
            holly-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync ACTIVE strategies from repo to cache (Phase 5)
        run: |
          mkdir -p .cache
          if [ -f data/holly_kr/active/active_strategies.json ]; then
            cp data/holly_kr/active/active_strategies.json .cache/active_strategies.json
            echo "ACTIVE strategies loaded from nightly selection:"
            cat .cache/active_strategies.json | python -m json.tool
          else
            echo "No nightly ACTIVE file found - --auto will use FALLBACK strategies"
          fi

      - name: Run daily scanner (auto mode, dynamic ACTIVE, telegram)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: https://openapivts.koreainvestment.com:29443
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python -m scripts.screeners.holly_kr.run --auto --entry close --telegram

      - name: Upload cache as artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holly-cache-snapshot
          path: .cache/
          retention-days: 3
          if-no-files-found: ignore
