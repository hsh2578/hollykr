name: HollyKR Weekly Backtest

on:
  schedule:
    # 매주 일요일 18:00 KST (UTC 09:00)
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: '백테스트 기간 (거래일)'
        required: false
        default: '200'
      sample:
        description: '샘플 종목 수 (0 = 전종목)'
        required: false
        default: '200'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore HollyKR caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: holly-cache-${{ github.run_number }}
          restore-keys: |
            holly-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest (32 strategies, OOS Train/Test split)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: https://openapivts.koreainvestment.com:29443
          PYTHONIOENCODING: utf-8
        run: |
          python -m scripts.screeners.holly_kr.backtest \
            --days ${{ github.event.inputs.days || '200' }} \
            --sample ${{ github.event.inputs.sample || '200' }} \
            --entry close --csv

      - name: Upload backtest results (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            data/holly_kr/backtest_summary_*.csv
            data/holly_kr/backtest_trades_*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Send backtest summary to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os, glob, asyncio
          import pandas as pd
          files = sorted(glob.glob('data/holly_kr/backtest_summary_*.csv'))
          if not files:
              print('No backtest summary found')
              raise SystemExit(0)
          df = pd.read_csv(files[-1])
          # 판정 컬럼 이름 탐색 (한/영 호환)
          verdict_col = next((c for c in df.columns if c in ('판정', 'Verdict', 'verdict')), None)
          passed = df[df[verdict_col] == 'PASS'] if verdict_col else df.head(0)
          overfit = df[df[verdict_col] == 'OVERFIT'] if verdict_col else df.head(0)
          failed = df[df[verdict_col] == 'FAIL'] if verdict_col else df.head(0)

          lines = [f'HollyKR 주간 백테스트 결과', '']
          lines.append(f'PASS {len(passed)} / OVERFIT {len(overfit)} / FAIL {len(failed)}')
          lines.append('')
          lines.append('[PASS 전략]')
          for _, r in passed.iterrows():
              name = r.get('전략', r.get('Strategy', '?'))
              pf = r.get('TestPF', '-')
              ret = r.get('Test수익', r.get('TestReturn', '-'))
              lines.append(f'  - {name}: PF {pf} / {ret}')

          msg = '\n'.join(lines)
          print(msg)

          from telegram import Bot
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if token and chat_id:
              asyncio.run(Bot(token=token).send_message(chat_id=chat_id, text=msg))
          PY
