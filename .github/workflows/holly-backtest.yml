name: HollyKR Daily Backtest

on:
  schedule:
    # 평일 20:00 KST (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: '백테스트 기간 (거래일)'
        required: false
        default: '200'
      sample:
        description: '샘플 종목 수 (0 = 전종목)'
        required: false
        default: '200'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul

    steps:
      - name: Set timezone to KST
        run: |
          sudo timedatectl set-timezone Asia/Seoul || true
          date

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore HollyKR caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: holly-cache-${{ github.run_number }}
          restore-keys: |
            holly-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest (32 strategies, OOS Train/Test split)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: https://openapivts.koreainvestment.com:29443
          PYTHONIOENCODING: utf-8
        run: |
          python -m scripts.screeners.holly_kr.backtest \
            --days ${{ github.event.inputs.days || '200' }} \
            --sample ${{ github.event.inputs.sample || '200' }} \
            --entry close --csv

      - name: Upload backtest results (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_number }}
          path: |
            data/holly_kr/backtest_summary_*.csv
            data/holly_kr/backtest_trades_*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Send backtest summary to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os, glob, asyncio
          import pandas as pd

          files = sorted(glob.glob('data/holly_kr/backtest_summary_*.csv'))
          if not files:
              print('No backtest summary found')
              raise SystemExit(0)
          df = pd.read_csv(files[-1])

          # CSV 구조: 각 전략마다 2행 (Train, Test 순서)
          # backtest.py의 판정 기준: win_rate>=0.4 AND profit_factor>=1.2
          def is_pass(trades, wr, pf):
              return trades > 0 and wr >= 0.4 and pf >= 1.2

          passed, overfit, failed, nosig = [], [], [], []
          for name, g in df.groupby('strategy', sort=False):
              g = g.reset_index(drop=True)
              if len(g) < 2:
                  nosig.append(name); continue
              tr = g.iloc[0]
              te = g.iloc[1]
              train_ok = is_pass(tr['trades'], tr['win_rate'], tr['profit_factor'])
              test_ok  = is_pass(te['trades'], te['win_rate'], te['profit_factor'])
              if te['trades'] == 0 and tr['trades'] == 0:
                  nosig.append(name)
              elif test_ok:
                  passed.append((name, te['profit_factor'], te['total_return']))
              elif train_ok and not test_ok:
                  overfit.append((name, te['profit_factor'], te['total_return']))
              else:
                  failed.append((name, te['profit_factor'], te['total_return']))

          passed.sort(key=lambda x: -x[1])

          lines = ['HollyKR 일일 백테스트 결과', '']
          lines.append(f'PASS {len(passed)} / OVERFIT {len(overfit)} / FAIL {len(failed)} / 시그널없음 {len(nosig)}')
          lines.append('')
          lines.append('[PASS 전략 (Test 기준)]')
          for name, pf, ret in passed:
              lines.append(f'  - {name}: PF {pf:.2f} / 수익 {ret*100:+.1f}%')

          if overfit:
              lines.append('')
              lines.append('[과적합 주의 — Train만 통과]')
              for name, pf, ret in overfit[:5]:
                  lines.append(f'  - {name}: TestPF {pf:.2f}')

          msg = '\n'.join(lines)
          print(msg)

          from telegram import Bot
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if token and chat_id:
              asyncio.run(Bot(token=token).send_message(chat_id=chat_id, text=msg))
          PY
